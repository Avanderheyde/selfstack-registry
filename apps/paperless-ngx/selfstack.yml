name: paperless-ngx
display_name: Paperless-ngx
description: Scan, index and archive your documents into a searchable digital archive
version: "1"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/paperless-ngx.svg

runtime:
  type: docker-compose
  entry: docker-compose.yml

expose:
  port: 8000
  health: /

# Django + celery + OCR workers: 256MB (the platform default) OOM-loops on
# first boot. Proven live 2026-08-05.
resources:
  memory_min_mb: 512
  memory_recommended_mb: 1024

volumes:
  - paperless-data:/usr/src/paperless/data
  - paperless-media:/usr/src/paperless/media
